<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #f4f6f8; margin: 0; padding: 40px 16px; color: #1c2b36; }
        .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 10px;
                padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
        h1 { margin: 0 0 4px; font-size: 1.5rem; }
        p.sub { margin: 0 0 24px; color: #5b6b7a; font-size: .95rem; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .9rem; }
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 18px;
                        border: 1px solid #cbd5dd; border-radius: 6px;
                        font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #2d7d46; color: #fff;
                 border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #246237; }
        .error { background: #fdecea; color: #a4262c; padding: 10px 12px;
                 border-radius: 6px; margin-bottom: 18px; font-size: .9rem; }
        .foot { margin-top: 20px; text-align: center; font-size: .9rem; color: #5b6b7a; }
        a { color: #2d7d46; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create an account</h1>
        <p class="sub">Choose the country whose recycling rules apply to you.</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form method="post">
            <label for="username">Name</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required
                   placeholder="you@example.com">

            <label for="country_id">Country</label>
            <select id="country_id" name="country_id" required>
                {% for country in countries %}
                    <option value="{{ country.country_id }}">{{ country.name }} ({{ country.code }})</option>
                {% endfor %}
            </select>

            <button type="submit">Create account</button>
        </form>

        <p class="foot">Already registered? <a href="{{ url_for('usermanagement.login') }}">Log in</a></p>
    </div>
</body>
</html>
